name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install ldid dpkg make 2>/dev/null || true
          which dpkg-deb || brew install dpkg 2>/dev/null || true

      # ============================================================
      # 安装标准 Theos（用于 rootless 编译）
      # ============================================================
      - name: Setup Theos (standard)
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 安装 Roothide Theos（用于 roothide 编译）
      #RELAXIN 越狱使用 RootHide 引导程序，需要专用 Theos
      # ============================================================
      - name: Setup Theos (roothide)
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos-roothide"
          echo "THEOS_ROOTHIDE=$HOME/theos-roothide" >> "$GITHUB_ENV"

      - name: Create private framework stubs
        run: |
          create_tbd() {
            local theos_path="$1"
            local framework_name="$2"
            local install_name="/System/Library/PrivateFrameworks/${framework_name}.framework/${framework_name}"
            local framework_dir="${theos_path}/vendor/lib/${framework_name}.framework"
            mkdir -p "$framework_dir"
            cat > "$framework_dir/${framework_name}.tbd" << EOF
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64e-ios ]
          platform:        ios
          install-name:    ${install_name}
          current-version: 0
          objc-constraint: retain_release
          ...
          EOF
            echo "Created stub: $framework_dir/${framework_name}.tbd"
          }

          for theos_path in "$HOME/theos" "$HOME/theos-roothide"; do
            echo "=== Creating stubs in $theos_path ==="
            for fw in SpringBoard BulletinBoard Preferences FrontBoard BackBoardServices AppSupport; do
              create_tbd "$theos_path" "$fw"
            done
          done

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version || true

      - name: Read version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^Version:" control | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${CURRENT_VERSION}"

      # ============================================================
      # 编译函数：支持 rootless 和 roothide 两种模式
      # ============================================================
      # Makefile 中 ARCHS = arm64 arm64e
      # Swift 代码通过 SPM 编译为 arm64（Swift 不支持 arm64e 目标）
      # C/ObjC 代码通过 clang 编译为 arm64 + arm64e
      # Theos 自动 lipo 合并为 fat binary
      #
      # 最终 deb 包含 arm64+arm64e 双架构 fat binary
      # ============================================================

      # ============================================================
      # 编译 1：Rootless 版本（Dopamine / palera1n rootless）
      # ============================================================
      - name: Build Rootless (arm64 + arm64e)
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""

          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ MobileMeadowStandalone/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ MobileMeadowStandalone/.theos/ 2>/dev/null || true

          echo "=== Rootless: make spm ==="
          make spm 2>&1

          echo "=== Rootless: make all (multi-arch) ==="
          make all 2>&1

          echo "=== Rootless: make package ==="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1

          # 重命名以区分
          for deb in packages/*.deb; do
            newname=$(echo "$deb" | sed 's/\.deb/_rootless.deb/')
            mv "$deb" "$newname"
            echo "Created: $newname"
          done

          # 验证架构
          echo "=== Rootless 构建产物架构 ==="
          find . -path "*/.theos/obj/*.dylib" -type f | while read f; do
            echo "  $f:"
            lipo -info "$f" 2>/dev/null || file "$f"
          done

      # ============================================================
      # 编译 2：Roothide 版本（RELAXIN / RootHide Bootstrap）
      #RELAXIN 越狱专用
      # ============================================================
      - name: Build Roothide (arm64 + arm64e)
        run: |
          export THEOS="$HOME/theos-roothide"
          export THEOS_FAKEROOT=""

          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ MobileMeadowStandalone/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ MobileMeadowStandalone/.theos/ 2>/dev/null || true

          echo "=== Roothide: make spm ==="
          make spm 2>&1

          echo "=== Roothide: make all (multi-arch) ==="
          make all 2>&1

          echo "=== Roothide: make package ==="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1

          # 重命名以区分
          for deb in packages/*.deb; do
            if echo "$deb" | grep -q "rootless"; then
              continue
            fi
            newname=$(echo "$deb" | sed 's/\.deb/_roothide.deb/')
            mv "$deb" "$newname"
            echo "Created: $newname"
          done

          # 验证架构
          echo "=== Roothide 构建产物架构 ==="
          find . -path "*/.theos/obj/*.dylib" -type f | while read f; do
            echo "  $f:"
            lipo -info "$f" 2>/dev/null || file "$f"
          done

      # ============================================================
      # 验证所有 deb 的架构
      # ============================================================
      - name: Verify all deb contents
        run: |
          echo "=== 最终 deb 架构验证 ==="
          for deb in packages/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -I "$deb" 2>&1 | grep -E "Package|Version|Architecture"
            TMPDIR=$(mktemp -d)
            dpkg-deb -R "$deb" "$TMPDIR/root" 2>/dev/null

            find "$TMPDIR/root" -type f -not -path "$TMPDIR/root/DEBIAN/*" | while read f; do
              if file "$f" | grep -q "Mach-O"; then
                macho_type=$(file "$f" | grep -o 'Mach-O [^,]*')
                if echo "$macho_type" | grep -q "dSYM"; then
                  echo "  [错误] $f 是 dSYM 文件！"
                else
                  echo "  [OK] $f"
                  arch_info=$(lipo -info "$f" 2>/dev/null || file "$f" | grep -o 'arm64[^ ]*')
                  echo "    架构: $arch_info"
                fi
              fi
            done

            rm -rf "$TMPDIR"
          done
          echo "=== 验证完成 ==="
          echo "=== packages 目录 ==="
          ls -la packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileMeadowReborn-${{ steps.version.outputs.current_version }}
          path: packages/*.deb
          if-no-files-found: warn

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current_version }}
          name: MobileMeadow Reborn v${{ steps.version.outputs.current_version }}
          body: |
            ## MobileMeadow Reborn v${{ steps.version.outputs.current_version }}

            ### 自动构建
            - iOS 15-17 兼容
            - arm64 + arm64e 双架构支持

            ### 两个版本

            | 文件 | 适用越狱 | 说明 |
            |------|---------|------|
            | `*_rootless.deb` | Dopamine, palera1n rootless | 标准 rootless 越狱 |
            | `*_roothide.deb` | RELAXIN, RootHide Bootstrap |RELAXIN 越狱专用 |

            ### 安装方法

            **Rootless 版本（Dopamine 等）：**
            1. 下载 `*_rootless.deb`
            2. 通过 Sileo 或 Filza 安装
            3. Respring 后生效

            **Roothide 版本（RELAXIN）：**
            1. 下载 `*_roothide.deb`
            2. 用 Roothide Patcher 转换（如果需要）
            3. 通过 Sileo 安装
            4. Respring 后生效

            ### iOS 17 注意事项
            - Dock 植物（花草）：已通过 SBDockView Hook 修复 iOS 17 兼容性
            - 飞鸟：已通过 UIWindowScene 方式适配 iOS 17
            - 如 SpringBoard 注入不生效，可尝试 MobileMeadowStandalone 独立 App
          files: packages/*.deb
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}