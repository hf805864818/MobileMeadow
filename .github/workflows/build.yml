name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install ldid dpkg make 2>/dev/null || true
          which dpkg-deb || brew install dpkg 2>/dev/null || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Create private framework stubs
        run: |
          THEOS="$HOME/theos"
          VENDOR_LIB="$THEOS/vendor/lib"
          mkdir -p "$VENDOR_LIB"
          create_tbd() {
            local framework_name="$1"
            local install_name="/System/Library/PrivateFrameworks/${framework_name}.framework/${framework_name}"
            local framework_dir="$VENDOR_LIB/${framework_name}.framework"
            mkdir -p "$framework_dir"
            cat > "$framework_dir/${framework_name}.tbd" << EOF
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64e-ios ]
          platform:        ios
          install-name:    ${install_name}
          current-version: 0
          objc-constraint: retain_release
          ...
          EOF
            echo "Created stub: $framework_dir/${framework_name}.tbd"
          }
          create_tbd "SpringBoard"
          create_tbd "BulletinBoard"
          create_tbd "Preferences"
          create_tbd "FrontBoard"
          create_tbd "BackBoardServices"
          create_tbd "AppSupport"
          echo "=== Private framework stubs created ==="

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version || true

      - name: Read version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^Version:" control | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${CURRENT_VERSION}"

      # ============================================================
      # 步骤 1：生成 SPM 配置并立即恢复我们的 Package.swift
      # make spm 会用 Theos 模板（硬编码 arm64）覆盖我们的动态架构版本
      # ============================================================
      - name: Generate SPM config and restore Package.swift
        run: |
          export THEOS="$HOME/theos"
          make spm
          # 恢复我们的 Package.swift（含动态架构检测），被 make spm 的模板覆盖了
          git checkout -- Package.swift Preferences/Package.swift MobileMeadowRebornApps/Package.swift
          echo "=== Package.swift files restored ==="
          head -48 Package.swift | tail -3

      # ============================================================
      # 步骤 2：构建 arm64
      # ============================================================
      - name: Build for arm64
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          make clean 2>/dev/null || true
          # 清理 SPM 构建缓存，确保干净编译
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/obj/ 2>/dev/null || true
          # make spm ARCHS=arm64 生成 .theos/spm_config（arch=arm64）
          make spm ARCHS=arm64 2>/dev/null || make spm
          # 恢复 Package.swift（被 make spm 覆盖）
          git checkout -- Package.swift Preferences/Package.swift MobileMeadowRebornApps/Package.swift
          echo "=== .theos/spm_config for arm64 ==="
          grep "^arch=" .theos/spm_config 2>/dev/null || echo "no spm_config yet"
          make all ARCHS=arm64 2>&1
          echo "=== arm64 build complete ==="
          mkdir -p /tmp/arm64_dylibs
          find . -name "*.dylib" \( -path "*/MobileMeadowReborn.dylib" -o -path "*/MobileMeadowRebornApps.dylib" \) 2>/dev/null | while read dylib; do
            cp "$dylib" "/tmp/arm64_dylibs/$(basename $dylib)"
            echo "Saved arm64: $(basename $dylib)"
          done
          ls -la /tmp/arm64_dylibs/ 2>/dev/null || echo "No arm64 dylibs found"

      # ============================================================
      # 步骤 3：构建 arm64e
      # 关键：make clean 后 make all 会触发 make spm，覆盖 Package.swift
      # 所以必须先 make spm，再 git checkout 恢复 Package.swift，
      # 然后 patch .theos/spm_config 把 arch=arm64 改为 arch=arm64e
      # 同时清理 SPM .build/ 缓存，防止复用 arm64 编译产物
      # ============================================================
      - name: Build for arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          make clean 2>/dev/null || true
          # 清理 SPM 构建缓存（关键：防止复用 arm64 的 .build/ 缓存）
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/obj/ 2>/dev/null || true
          # 先运行 make spm（生成 .theos/spm_config，但 arch=arm64）
          make spm 2>/dev/null || true
          # 恢复 Package.swift（含动态架构检测）
          git checkout -- Package.swift Preferences/Package.swift MobileMeadowRebornApps/Package.swift
          # 修补 .theos/spm_config：把 arch=arm64 改为 arch=arm64e
          if [ -f .theos/spm_config ]; then
            sed -i '' 's/^arch=arm64$/arch=arm64e/' .theos/spm_config
            echo "=== patched .theos/spm_config arch to arm64e ==="
            grep "^arch=" .theos/spm_config
          fi
          # 构建 arm64e
          make all ARCHS=arm64e 2>&1
          echo "=== arm64e build complete ==="
          mkdir -p /tmp/arm64e_dylibs
          find . -name "*.dylib" \( -path "*/MobileMeadowReborn.dylib" -o -path "*/MobileMeadowRebornApps.dylib" \) 2>/dev/null | while read dylib; do
            cp "$dylib" "/tmp/arm64e_dylibs/$(basename $dylib)"
            echo "Saved arm64e: $(basename $dylib)"
          done
          ls -la /tmp/arm64e_dylibs/ 2>/dev/null || echo "No arm64e dylibs found"

      # ============================================================
      # 步骤 4：验证架构后合并为 fat binary
      # ============================================================
      - name: Verify architectures and create fat binaries
        run: |
          echo "=== Verifying arm64 dylibs ==="
          for dylib in /tmp/arm64_dylibs/*.dylib; do
            echo "--- $(basename $dylib) ---"
            lipo -info "$dylib" 2>/dev/null || file "$dylib"
          done
          echo "=== Verifying arm64e dylibs ==="
          for dylib in /tmp/arm64e_dylibs/*.dylib; do
            echo "--- $(basename $dylib) ---"
            lipo -info "$dylib" 2>/dev/null || file "$dylib"
          done
          echo "=== Creating fat binaries ==="
          mkdir -p /tmp/fat_dylibs
          for arm64_dylib in /tmp/arm64_dylibs/*.dylib; do
            dylib_name=$(basename "$arm64_dylib")
            arm64e_dylib="/tmp/arm64e_dylibs/${dylib_name}"
            fat_dylib="/tmp/fat_dylibs/${dylib_name}"
            if [ -f "$arm64e_dylib" ]; then
              echo "Combining ${dylib_name}: arm64 + arm64e"
              lipo -create "$arm64_dylib" "$arm64e_dylib" -output "$fat_dylib"
              lipo -info "$fat_dylib"
            else
              echo "WARNING: arm64e variant not found for ${dylib_name}, using arm64 only"
              cp "$arm64_dylib" "$fat_dylib"
            fi
          done
          ls -la /tmp/fat_dylibs/

      # ============================================================
      # 步骤 5：用 fat binary 替换后打包
      # ============================================================
      - name: Package with fat binaries
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/obj/ 2>/dev/null || true
          make spm 2>/dev/null || true
          git checkout -- Package.swift Preferences/Package.swift MobileMeadowRebornApps/Package.swift
          make all ARCHS=arm64 2>&1
          echo "=== Replacing with fat binaries ==="
          find . -name "*.dylib" \( -path "*/MobileMeadowReborn.dylib" -o -path "*/MobileMeadowRebornApps.dylib" \) 2>/dev/null | while read dylib; do
            dylib_name=$(basename "$dylib")
            fat_dylib="/tmp/fat_dylibs/${dylib_name}"
            if [ -f "$fat_dylib" ]; then
              cp "$fat_dylib" "$dylib"
              echo "Replaced ${dylib_name} with fat binary"
              lipo -info "$dylib"
            fi
          done
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1

      - name: Verify final architectures
        run: |
          echo "=== Final architecture verification ==="
          find . -name "*.dylib" \( -path "*/MobileMeadowReborn.dylib" -o -path "*/MobileMeadowRebornApps.dylib" \) 2>/dev/null | while read dylib; do
            echo "--- $dylib ---"
            lipo -info "$dylib" 2>/dev/null || file "$dylib"
          done
          for deb in packages/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -c "$deb" 2>/dev/null || ar t "$deb" 2>/dev/null || echo "  (cannot list contents)"
          done

      - name: List and upload artifacts
        run: |
          echo "=== Build artifacts ==="
          find packages -type f -name "*.deb" 2>/dev/null || echo "No .deb found"
          ls -la packages/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileMeadowReborn-${{ steps.version.outputs.current_version }}
          path: packages/*.deb
          if-no-files-found: warn

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current_version }}
          name: MobileMeadow Reborn v${{ steps.version.outputs.current_version }}
          body: |
            ## MobileMeadow Reborn v${{ steps.version.outputs.current_version }}

            ### 自动构建
            - 由 GitHub Actions 自动编译
            - iOS 15-17 兼容
            - arm64 + arm64e 双架构支持
            - Rootless jailbreak 支持

            ### 安装方法
            1. 下载 .deb 文件
            2. 通过 Sileo 或 Filza 安装
            3. Respring 后生效
          files: packages/*.deb
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}