name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install ldid dpkg make 2>/dev/null || true
          which dpkg-deb || brew install dpkg 2>/dev/null || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Create private framework stubs
        run: |
          THEOS="$HOME/theos"
          VENDOR_LIB="$THEOS/vendor/lib"
          mkdir -p "$VENDOR_LIB"
          create_tbd() {
            local framework_name="$1"
            local install_name="/System/Library/PrivateFrameworks/${framework_name}.framework/${framework_name}"
            local framework_dir="$VENDOR_LIB/${framework_name}.framework"
            mkdir -p "$framework_dir"
            cat > "$framework_dir/${framework_name}.tbd" << EOF
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64e-ios ]
          platform:        ios
          install-name:    ${install_name}
          current-version: 0
          objc-constraint: retain_release
          ...
          EOF
            echo "Created stub: $framework_dir/${framework_name}.tbd"
          }
          create_tbd "SpringBoard"
          create_tbd "BulletinBoard"
          create_tbd "Preferences"
          create_tbd "FrontBoard"
          create_tbd "BackBoardServices"
          create_tbd "AppSupport"
          echo "=== Private framework stubs created ==="

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version || true

      - name: Read version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^Version:" control | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${CURRENT_VERSION}"

      # ============================================================
      # 步骤 1：构建 arm64
      # Package.swift 已修复：优先读取 THEOS_CURRENT_ARCH 环境变量
      # 不再需要 make spm 之后修改 spm_config
      # ============================================================
      - name: Build for arm64
        env:
          THEOS_CURRENT_ARCH: arm64
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          # 彻底清理，避免上次构建的缓存影响
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true
          # make spm 会生成 spm_config 并运行 swift build
          # Package.swift 通过 THEOS_CURRENT_ARCH 环境变量读取到 arm64
          make spm THEOS_CURRENT_ARCH=arm64 2>&1
          echo "=== spm_config 内容 ==="
          cat .theos/spm_config 2>/dev/null || echo "spm_config not found"
          # 构建主项目和子项目
          make all ARCHS=arm64 THEOS_CURRENT_ARCH=arm64 2>&1
          echo "=== arm64 构建完成，保存二进制 ==="
          SAVE_DIR="/tmp/arch_bin/arm64"
          rm -rf "$SAVE_DIR"
          mkdir -p "$SAVE_DIR"
          find . -path "*/.theos/obj/*" -type f \( -name "*.dylib" -o -name "MobileMeadowRebornPrefs" \) 2>/dev/null | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              rel_path="${f#./}"
              mkdir -p "$SAVE_DIR/$(dirname "$rel_path")"
              cp "$f" "$SAVE_DIR/$rel_path"
              echo "Saved arm64: $rel_path"
            fi
          done
          echo "=== arm64 二进制架构验证 ==="
          find "$SAVE_DIR" -type f -exec lipo -info {} \;
          # 验证确实有 arm64 二进制
          if [ -z "$(find "$SAVE_DIR" -type f)" ]; then
            echo "FATAL: 没有构建出任何 arm64 二进制！"
            exit 1
          fi

      # ============================================================
      # 步骤 2：构建 arm64e
      # 关键修复：THEOS_CURRENT_ARCH=arm64e 通过环境变量和命令行双重传递
      # Package.swift 优先读取环境变量，确保 SPM 编译 arm64e
      # ============================================================
      - name: Build for arm64e
        env:
          THEOS_CURRENT_ARCH: arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          # 彻底清理
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true
          # make spm - Package.swift 通过 THEOS_CURRENT_ARCH=arm64e 环境变量编译 arm64e
          make spm THEOS_CURRENT_ARCH=arm64e 2>&1
          echo "=== spm_config 内容 ==="
          cat .theos/spm_config 2>/dev/null || echo "spm_config not found"
          # 构建主项目和子项目
          make all ARCHS=arm64e THEOS_CURRENT_ARCH=arm64e 2>&1
          echo "=== arm64e 构建完成，保存二进制 ==="
          SAVE_DIR="/tmp/arch_bin/arm64e"
          rm -rf "$SAVE_DIR"
          mkdir -p "$SAVE_DIR"
          find . -path "*/.theos/obj/*" -type f \( -name "*.dylib" -o -name "MobileMeadowRebornPrefs" \) 2>/dev/null | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              rel_path="${f#./}"
              mkdir -p "$SAVE_DIR/$(dirname "$rel_path")"
              cp "$f" "$SAVE_DIR/$rel_path"
              echo "Saved arm64e: $rel_path"
            fi
          done
          echo "=== arm64e 二进制架构验证 ==="
          find "$SAVE_DIR" -type f -exec lipo -info {} \;
          # 关键验证：确认二进制确实是 arm64e 架构
          if [ -z "$(find "$SAVE_DIR" -type f)" ]; then
            echo "FATAL: 没有构建出任何 arm64e 二进制！"
            exit 1
          fi
          ARM64E_COUNT=0
          find "$SAVE_DIR" -type f | while read f; do
            if lipo -info "$f" 2>/dev/null | grep -q "arm64e"; then
              echo "OK: $f 包含 arm64e"
            else
              echo "WARNING: $f 不包含 arm64e 架构"
            fi
          done

      # ============================================================
      # 步骤 3：创建 fat binaries (arm64 + arm64e)
      # ============================================================
      - name: Create fat binaries
        run: |
          echo "=== 创建 fat binaries ==="
          FAT_DIR="/tmp/arch_bin/fat"
          rm -rf "$FAT_DIR"
          mkdir -p "$FAT_DIR"
          ARM64_DIR="/tmp/arch_bin/arm64"
          ARM64E_DIR="/tmp/arch_bin/arm64e"
          find "$ARM64_DIR" -type f | while read arm64_file; do
            rel_path="${arm64_file#$ARM64_DIR/}"
            arm64e_file="$ARM64E_DIR/$rel_path"
            fat_file="$FAT_DIR/$rel_path"
            mkdir -p "$(dirname "$fat_file")"
            if [ -f "$arm64e_file" ]; then
              echo "Creating fat: $rel_path"
              lipo -create "$arm64_file" "$arm64e_file" -output "$fat_file"
              lipo -info "$fat_file"
            else
              echo "WARNING: 没有 arm64e 版本的 $rel_path，仅使用 arm64"
              cp "$arm64_file" "$fat_file"
            fi
          done
          echo "=== Fat binaries 创建完成 ==="
          find "$FAT_DIR" -type f | while read f; do
            echo "--- $f ---"
            lipo -info "$f"
          done

      # ============================================================
      # 步骤 4：构建 deb 包并替换为 fat binaries
      # 关键修复：移除 ldid -S 重新签名步骤
      # ldid -S 会破坏 fat binary 的 Mach-O 格式，导致 "Unsupported Mach-O type" 错误
      # Theos 构建过程中已经对二进制进行了签名，lipo 合并后签名仍然有效
      # ============================================================
      - name: Package with fat binaries
        env:
          THEOS_CURRENT_ARCH: arm64
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          PROJECT_DIR="$PWD"
          # 构建基础 arm64 包
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true
          make spm THEOS_CURRENT_ARCH=arm64 2>&1
          echo "=== 构建 deb 包 (arm64 基础) ==="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64 THEOS_CURRENT_ARCH=arm64 2>&1
          echo "=== 包构建完成，开始注入 fat binaries ==="
          FAT_DIR="/tmp/arch_bin/fat"
          DEB_FILE=$(ls "$PROJECT_DIR/packages/"*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: 没有找到 .deb 文件！"
            ls -la "$PROJECT_DIR/packages/" 2>/dev/null || echo "packages 目录不存在"
            exit 1
          fi
          echo "原始 deb: $DEB_FILE"
          # 解包 deb
          WORK_DIR="/tmp/deb_work"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR/root"
          dpkg-deb -R "$DEB_FILE" "$WORK_DIR/root"
          echo "=== 解包内容 ==="
          ls -la "$WORK_DIR/root/"
          ls -la "$WORK_DIR/root/DEBIAN/" 2>/dev/null
          # 替换二进制为 fat 版本
          # 关键：不执行 ldid -S！二进制在 Theos 构建时已经签名
          echo "=== 替换二进制 ==="
          find "$WORK_DIR/root" -type f -not -path "$WORK_DIR/root/DEBIAN/*" | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              bin_name=$(basename "$f")
              fat_candidate=$(find "$FAT_DIR" -name "$bin_name" -type f 2>/dev/null | head -1)
              if [ -n "$fat_candidate" ] && [ -f "$fat_candidate" ]; then
                echo "替换 $bin_name 为 fat binary"
                cp "$fat_candidate" "$f"
                lipo -info "$f"
              else
                echo "WARNING: 没有找到 $bin_name 的 fat binary"
              fi
            fi
          done
          # 重新打包 deb
          echo "=== 重新打包 deb ==="
          NEW_DEB="$PROJECT_DIR/packages/$(basename "$DEB_FILE")"
          rm -f "$NEW_DEB"
          dpkg-deb -b --root-owner-group "$WORK_DIR/root" "$NEW_DEB"
          cd "$PROJECT_DIR"
          echo "=== Fat binary deb 创建完成: $NEW_DEB ==="
          ls -la "$NEW_DEB"
          dpkg-deb -I "$NEW_DEB" 2>&1 | head -20

      # ============================================================
      # 步骤 5：验证最终 deb 中的架构
      # ============================================================
      - name: Verify final architectures
        run: |
          echo "=== 最终 deb 架构验证 ==="
          for deb in packages/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -I "$deb" 2>&1 | grep -E "Package|Version|Architecture"
            TMPDIR=$(mktemp -d)
            dpkg-deb -R "$deb" "$TMPDIR/root" 2>/dev/null
            find "$TMPDIR/root" -type f -not -path "$TMPDIR/root/DEBIAN/*" | while read f; do
              if file "$f" | grep -q "Mach-O"; then
                echo "--- $f ---"
                lipo -info "$f" 2>/dev/null || file "$f"
              fi
            done
            rm -rf "$TMPDIR"
          done
          # 最终检查：确保至少有一个 fat binary
          FOUND_FAT=0
          TMPDIR=$(mktemp -d)
          for deb in packages/*.deb; do
            dpkg-deb -R "$deb" "$TMPDIR/root" 2>/dev/null
            find "$TMPDIR/root" -type f -not -path "$TMPDIR/root/DEBIAN/*" | while read f; do
              if lipo -info "$f" 2>/dev/null | grep -q "arm64e"; then
                echo "OK: $f 包含 arm64e 架构"
                echo "1" > /tmp/found_fat
              fi
            done
          done
          rm -rf "$TMPDIR"
          if [ -f /tmp/found_fat ]; then
            echo "=== 验证通过：deb 包含 arm64e 架构 ==="
          else
            echo "=== WARNING: deb 中没有找到 arm64e 架构 ==="
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileMeadowReborn-${{ steps.version.outputs.current_version }}
          path: packages/*.deb
          if-no-files-found: warn

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current_version }}
          name: MobileMeadow Reborn v${{ steps.version.outputs.current_version }}
          body: |
            ## MobileMeadow Reborn v${{ steps.version.outputs.current_version }}

            ### 自动构建
            - 由 GitHub Actions 自动编译
            - iOS 15-17 兼容
            - arm64 + arm64e 双架构支持 (fat binary)
            - Rootless jailbreak 支持

            ### 安装方法
            1. 下载 .deb 文件
            2. 通过 Sileo 或 Filza 安装
            3. Respring 后生效
          files: packages/*.deb
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
