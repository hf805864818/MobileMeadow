name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install ldid dpkg make 2>/dev/null || true
          which dpkg-deb || brew install dpkg 2>/dev/null || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Create private framework stubs
        run: |
          THEOS="$HOME/theos"
          VENDOR_LIB="$THEOS/vendor/lib"
          mkdir -p "$VENDOR_LIB"
          create_tbd() {
            local framework_name="$1"
            local install_name="/System/Library/PrivateFrameworks/${framework_name}.framework/${framework_name}"
            local framework_dir="$VENDOR_LIB/${framework_name}.framework"
            mkdir -p "$framework_dir"
            cat > "$framework_dir/${framework_name}.tbd" << EOF
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64e-ios ]
          platform:        ios
          install-name:    ${install_name}
          current-version: 0
          objc-constraint: retain_release
          ...
          EOF
            echo "Created stub: $framework_dir/${framework_name}.tbd"
          }
          create_tbd "SpringBoard"
          create_tbd "BulletinBoard"
          create_tbd "Preferences"
          create_tbd "FrontBoard"
          create_tbd "BackBoardServices"
          create_tbd "AppSupport"
          echo "=== Private framework stubs created ==="

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version || true

      - name: Read version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^Version:" control | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${CURRENT_VERSION}"

      # ============================================================
      # Helper function: build for a specific architecture and save binaries
      # Usage: build_arch <arch> <output_dir>
      # ============================================================

      # ============================================================
      # 步骤 1：构建 arm64 并保存所有 Mach-O 二进制
      # ============================================================
      - name: Build for arm64
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true
          make spm 2>/dev/null || make spm
          echo "arch=arm64" >> .theos/spm_config
          echo "=== .theos/spm_config for arm64 ==="
          cat .theos/spm_config
          make all ARCHS=arm64 2>&1
          echo "=== arm64 build complete, saving binaries ==="
          # 保存所有 Mach-O 二进制（主项目 + 子项目），保留相对路径
          SAVE_DIR="/tmp/arch_bin/arm64"
          rm -rf "$SAVE_DIR"
          mkdir -p "$SAVE_DIR"
          find . -path "*/.theos/obj/*" -type f \( -name "*.dylib" -o -name "MobileMeadowRebornPrefs" \) 2>/dev/null | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              rel_path="${f#./}"
              mkdir -p "$SAVE_DIR/$(dirname "$rel_path")"
              cp "$f" "$SAVE_DIR/$rel_path"
              echo "Saved arm64: $rel_path ($(file "$f" | grep -o 'Mach-O [^,]*'))"
            fi
          done
          echo "=== arm64 binaries saved ==="
          find "$SAVE_DIR" -type f

      # ============================================================
      # 步骤 2：构建 arm64e 并保存所有 Mach-O 二进制
      # ============================================================
      - name: Build for arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true
          make spm 2>/dev/null || make spm
          echo "arch=arm64e" >> .theos/spm_config
          # 子项目的 spm_config 也需要注入 arch
          for proj in Preferences MobileMeadowRebornApps; do
            if [ -f "$proj/.theos/spm_config" ]; then
              echo "arch=arm64e" >> "$proj/.theos/spm_config"
            fi
          done
          echo "=== .theos/spm_config for arm64e ==="
          cat .theos/spm_config
          make all ARCHS=arm64e 2>&1
          echo "=== arm64e build complete, saving binaries ==="
          SAVE_DIR="/tmp/arch_bin/arm64e"
          rm -rf "$SAVE_DIR"
          mkdir -p "$SAVE_DIR"
          find . -path "*/.theos/obj/*" -type f \( -name "*.dylib" -o -name "MobileMeadowRebornPrefs" \) 2>/dev/null | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              rel_path="${f#./}"
              mkdir -p "$SAVE_DIR/$(dirname "$rel_path")"
              cp "$f" "$SAVE_DIR/$rel_path"
              echo "Saved arm64e: $rel_path ($(file "$f" | grep -o 'Mach-O [^,]*'))"
            fi
          done
          echo "=== arm64e binaries saved ==="
          find "$SAVE_DIR" -type f

      # ============================================================
      # 步骤 3：创建 fat binaries
      # ============================================================
      - name: Create fat binaries
        run: |
          echo "=== Creating fat binaries ==="
          FAT_DIR="/tmp/arch_bin/fat"
          rm -rf "$FAT_DIR"
          mkdir -p "$FAT_DIR"
          ARM64_DIR="/tmp/arch_bin/arm64"
          ARM64E_DIR="/tmp/arch_bin/arm64e"
          # 遍历所有 arm64 二进制，与 arm64e 对应文件合并
          find "$ARM64_DIR" -type f | while read arm64_file; do
            rel_path="${arm64_file#$ARM64_DIR/}"
            arm64e_file="$ARM64E_DIR/$rel_path"
            fat_file="$FAT_DIR/$rel_path"
            mkdir -p "$(dirname "$fat_file")"
            if [ -f "$arm64e_file" ]; then
              echo "Creating fat: $rel_path"
              lipo -create "$arm64_file" "$arm64e_file" -output "$fat_file"
              lipo -info "$fat_file"
            else
              echo "WARNING: no arm64e for $rel_path, using arm64 only"
              cp "$arm64_file" "$fat_file"
            fi
          done
          echo "=== Fat binaries created ==="
          find "$FAT_DIR" -type f | while read f; do
            echo "--- $f ---"
            lipo -info "$f"
          done

      # ============================================================
      # 步骤 4：构建 arm64 包，然后替换二进制为 fat binary，重新打包
      # 采用"解包-替换-重新打包"方案，确保 fat binary 进入最终 deb
      # ============================================================
      - name: Package with fat binaries
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          # 保存项目根目录的绝对路径
          PROJECT_DIR="$PWD"
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true
          make spm 2>/dev/null || make spm
          echo "arch=arm64" >> .theos/spm_config
          # 子项目也注入 arch
          for proj in Preferences MobileMeadowRebornApps; do
            if [ -d "$proj" ]; then
              (cd "$proj" && make spm 2>/dev/null || true)
              if [ -f "$proj/.theos/spm_config" ]; then
                grep -q "^arch=" "$proj/.theos/spm_config" || echo "arch=arm64" >> "$proj/.theos/spm_config"
              fi
            fi
          done
          echo "=== Building package (arm64 base) ==="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64 2>&1
          echo "=== Package built, now injecting fat binaries ==="
          FAT_DIR="/tmp/arch_bin/fat"
          # 找到生成的 deb（使用绝对路径）
          DEB_FILE=$(ls "$PROJECT_DIR/packages/"*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb file found!"
            ls -la "$PROJECT_DIR/packages/" 2>/dev/null || echo "packages dir not found"
            exit 1
          fi
          echo "Original deb: $DEB_FILE"
          # 使用 dpkg-deb 解包整个 deb（包括 control 文件和数据）
          WORK_DIR="/tmp/deb_work"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR/root"
          # dpkg-deb -R 解压完整目录结构（DEBIAN/ + 数据文件）
          dpkg-deb -R "$DEB_FILE" "$WORK_DIR/root"
          echo "=== Extracted deb contents ==="
          ls -la "$WORK_DIR/root/"
          ls -la "$WORK_DIR/root/DEBIAN/" 2>/dev/null
          echo "=== Replacing binaries with fat versions ==="
          # 在解压的数据中找到所有 Mach-O 二进制并替换
          find "$WORK_DIR/root" -type f -not -path "$WORK_DIR/root/DEBIAN/*" | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              bin_name=$(basename "$f")
              fat_candidate=$(find "$FAT_DIR" -name "$bin_name" -type f 2>/dev/null | head -1)
              if [ -n "$fat_candidate" ] && [ -f "$fat_candidate" ]; then
                echo "Replacing $bin_name with fat binary"
                cp "$fat_candidate" "$f"
                ldid -S "$f" 2>/dev/null || true
              else
                echo "WARNING: No fat binary found for $bin_name"
              fi
            fi
          done
          echo "=== Verifying architectures ==="
          find "$WORK_DIR/root" -type f -not -path "$WORK_DIR/root/DEBIAN/*" | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "--- $f ---"
              lipo -info "$f" 2>/dev/null || file "$f"
            fi
          done
          # 使用 dpkg-deb -b 重新打包
          echo "=== Rebuilding deb with dpkg-deb ==="
          NEW_DEB="$PROJECT_DIR/packages/$(basename "$DEB_FILE")"
          rm -f "$NEW_DEB"
          dpkg-deb -b --root-owner-group "$WORK_DIR/root" "$NEW_DEB"
          cd "$PROJECT_DIR"
          echo "=== Fat binary deb created: $NEW_DEB ==="
          ls -la "$NEW_DEB"
          dpkg-deb -I "$NEW_DEB" 2>&1 | head -20

      - name: Verify final architectures
        run: |
          echo "=== Final deb architecture verification ==="
          for deb in packages/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -I "$deb" 2>&1 | grep -E "Package|Version|Architecture"
            TMPDIR=$(mktemp -d)
            dpkg-deb -R "$deb" "$TMPDIR/root" 2>/dev/null
            find "$TMPDIR/root" -type f -not -path "$TMPDIR/root/DEBIAN/*" | while read f; do
              if file "$f" | grep -q "Mach-O"; then
                echo "--- $f ---"
                lipo -info "$f" 2>/dev/null || file "$f"
              fi
            done
            rm -rf "$TMPDIR"
          done

      - name: List and upload artifacts
        run: |
          echo "=== Build artifacts ==="
          find packages -type f -name "*.deb" 2>/dev/null || echo "No .deb found"
          ls -la packages/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileMeadowReborn-${{ steps.version.outputs.current_version }}
          path: packages/*.deb
          if-no-files-found: warn

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current_version }}
          name: MobileMeadow Reborn v${{ steps.version.outputs.current_version }}
          body: |
            ## MobileMeadow Reborn v${{ steps.version.outputs.current_version }}

            ### 自动构建
            - 由 GitHub Actions 自动编译
            - iOS 15-17 兼容
            - arm64 + arm64e 双架构支持
            - Rootless jailbreak 支持

            ### 安装方法
            1. 下载 .deb 文件
            2. 通过 Sileo 或 Filza 安装
            3. Respring 后生效
          files: packages/*.deb
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
