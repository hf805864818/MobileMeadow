name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install ldid dpkg make 2>/dev/null || true
          which dpkg-deb || brew install dpkg 2>/dev/null || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Create private framework stubs
        run: |
          THEOS="$HOME/theos"
          VENDOR_LIB="$THEOS/vendor/lib"
          mkdir -p "$VENDOR_LIB"
          create_tbd() {
            local framework_name="$1"
            local install_name="/System/Library/PrivateFrameworks/${framework_name}.framework/${framework_name}"
            local framework_dir="$VENDOR_LIB/${framework_name}.framework"
            mkdir -p "$framework_dir"
            cat > "$framework_dir/${framework_name}.tbd" << EOF
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64e-ios ]
          platform:        ios
          install-name:    ${install_name}
          current-version: 0
          objc-constraint: retain_release
          ...
          EOF
            echo "Created stub: $framework_dir/${framework_name}.tbd"
          }
          create_tbd "SpringBoard"
          create_tbd "BulletinBoard"
          create_tbd "Preferences"
          create_tbd "FrontBoard"
          create_tbd "BackBoardServices"
          create_tbd "AppSupport"
          echo "=== Private framework stubs created ==="

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version || true

      - name: Read version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^Version:" control | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${CURRENT_VERSION}"

      # ============================================================
      # 核心修复：使用 Theos 原生多架构编译，不再手动构建 fat binary
      #
      # 之前的方案有致命 bug：
      # 1. 手动 find .theos/obj 会匹配到 dSYM 调试符号文件
      # 2. dSYM 文件被当作真正的二进制替换进了 deb
      # 3. 导致 MobileMeadowRebornApps.dylib 和 MobileMeadowRebornPrefs
      #    实际上是 dSYM 文件，不是可执行代码
      # 4. 这就是 ldid: Unsupported Mach-O type 的根本原因
      #
      # 新方案：让 Theos 自己处理多架构编译和打包
      # Makefile 中已设置 export ARCHS = arm64 arm64e
      # ============================================================
      - name: Build with Theos native multi-arch
        run: |
          export THEOS="$HOME/theos"
          export THEOS_FAKEROOT=""
          PROJECT_DIR="$PWD"

          # 清理
          make clean 2>/dev/null || true
          rm -rf .build/ Preferences/.build/ MobileMeadowRebornApps/.build/ 2>/dev/null || true
          rm -rf .theos/ Preferences/.theos/ MobileMeadowRebornApps/.theos/ 2>/dev/null || true

          # SPM 编译（arm64，Swift 不支持 arm64e 目标）
          echo "=== Step 1: make spm ==="
          make spm 2>&1
          echo "=== spm_config ==="
          cat .theos/spm_config 2>/dev/null || echo "no spm_config"

          # Theos 原生多架构编译
          # Makefile 中 ARCHS = arm64 arm64e
          # Theos 会：
          #   1. 用 arm64 SPM 产物
          #   2. 用 clang 编译 C/ObjC 为 arm64 和 arm64e
          #   3. 链接 arm64 SPM + arm64 C/ObjC → arm64 slice
          #   4. 链接 arm64 SPM + arm64e C/ObjC → arm64e slice
          #   5. lipo 合并为 fat binary
          echo "=== Step 2: make all (multi-arch) ==="
          make all 2>&1

          # 打包
          echo "=== Step 3: make package ==="
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1

          # 验证构建产物
          echo "=== 构建产物 ==="
          ls -la packages/ 2>/dev/null || echo "no packages/"
          ls -la .theos/obj/ 2>/dev/null || echo "no .theos/obj/"

          # 验证 .theos/obj 中的二进制架构
          echo "=== .theos/obj 中的二进制架构 ==="
          find . -path "*/.theos/obj/*" -type f | while read f; do
            if file "$f" | grep -q "Mach-O"; then
              macho_type=$(file "$f" | grep -o 'Mach-O [^,]*')
              # 排除 dSYM 文件
              if echo "$macho_type" | grep -q "dSYM"; then
                echo "  [DSYM - 跳过] $f"
              else
                echo "  [BINARY] $f: $macho_type"
                lipo -info "$f" 2>/dev/null || echo "    (非 fat binary)"
              fi
            fi
          done

      # ============================================================
      # 验证最终 deb 中的二进制文件
      # 关键检查：
      # 1. 二进制必须是真正的 Mach-O 可执行文件，不是 dSYM
      # 2. 检查是否包含 arm64e 架构
      # ============================================================
      - name: Verify deb contents
        run: |
          echo "=== 最终 deb 架构验证 ==="
          for deb in packages/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -I "$deb" 2>&1 | grep -E "Package|Version|Architecture"
            TMPDIR=$(mktemp -d)
            dpkg-deb -R "$deb" "$TMPDIR/root" 2>/dev/null

            ALL_OK=true
            find "$TMPDIR/root" -type f -not -path "$TMPDIR/root/DEBIAN/*" | while read f; do
              if file "$f" | grep -q "Mach-O"; then
                macho_type=$(file "$f" | grep -o 'Mach-O [^,]*')
                if echo "$macho_type" | grep -q "dSYM"; then
                  echo "  [错误] $f 是 dSYM 文件，不是可执行代码！"
                  ALL_OK=false
                else
                  echo "  [OK] $f"
                  arch_info=$(lipo -info "$f" 2>/dev/null || file "$f" | grep -o 'arm64[^ ]*')
                  echo "    架构: $arch_info"
                fi
              fi
            done

            rm -rf "$TMPDIR"
          done

          echo "=== 验证完成 ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileMeadowReborn-${{ steps.version.outputs.current_version }}
          path: packages/*.deb
          if-no-files-found: warn

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current_version }}
          name: MobileMeadow Reborn v${{ steps.version.outputs.current_version }}
          body: |
            ## MobileMeadow Reborn v${{ steps.version.outputs.current_version }}

            ### 自动构建
            - 由 GitHub Actions 自动编译
            - iOS 15-17 兼容
            - arm64 + arm64e 双架构支持
            - Rootless jailbreak 支持

            ### 安装方法
            1. 下载 .deb 文件
            2. 通过 Sileo 或 Filza 安装
            3. Respring 后生效
          files: packages/*.deb
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}